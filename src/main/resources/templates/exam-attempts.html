<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>شرکت‌کنندگان آزمون</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">شرکت‌کنندگان آزمون</h4>
        <a th:href="@{'/course/' + ${courseCode} + '/ownExams'}" class="btn btn-secondary btn-sm">بازگشت</a>
    </div>

    <div class="mb-2 text-muted">
        درس: <span th:text="${courseCode}"></span> | آزمون: <span th:text="${examCode}"></span>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th>دانشجو</th>
            <th>وضعیت</th>
            <th>شروع</th>
            <th>پایان</th>
            <th>ثبت</th>
            <th>نمره</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${attempts}">
            <td th:text="${a.student.username}"></td>
            <td th:text="${a.status}"></td>
            <td th:text="${a.startedAt}"></td>
            <td th:text="${a.endsAt}"></td>
            <td th:text="${a.submittedAt}"></td>
            <td th:text="${a.totalScore}"></td>
            <td style="width: 160px;">
                <a class="btn btn-primary btn-sm"
                   th:href="@{/teacher/attempt/{id}(id=${a.id})}">
                    مشاهده/نمره‌دهی
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(attempts)}">
            <td colspan="7">هنوز هیچ دانشجویی در این آزمون شرکت نکرده است.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
