<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>جزئیات آزمون دانشجو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">جزئیات آزمون</h4>
        <a th:href="@{/teacher/course/{courseCode}/exam/{examCode}/attempts(courseCode=${attempt.exam.course.courseCode},examCode=${attempt.exam.examCode})}"
           class="btn btn-secondary btn-sm">بازگشت</a>
    </div>

    <div class="mb-3">
        <div class="text-muted">دانشجو: <strong th:text="${attempt.student.username}"></strong></div>
        <div class="text-muted">وضعیت: <span th:text="${attempt.status}"></span></div>
        <div class="text-muted">نمره کل: <strong th:text="${attempt.totalScore}"></strong></div>
    </div>

    <div class="alert alert-success" th:if="${scoreSaved}" th:text="${scoreSaved}"></div>

    <div class="card mb-3" th:each="aa, stat : ${answers}">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <h5 class="card-title">
                    سوال <span th:text="${stat.index + 1}"></span>:
                    <span th:text="${aa.examQuestion.title}"></span>
                </h5>
                <div class="text-muted">
                    نمره سوال: <span th:text="${aa.examQuestion.score}"></span>
                </div>
            </div>

            <p class="card-text" th:text="${aa.examQuestion.text}"></p>

            <div th:if="${aa.examQuestion.questionType.name() == 'MULTIPLE_CHOICE'}">
                <div class="mb-2">
                    <strong>گزینه انتخابی:</strong>
                    <span th:text="${aa.selectedExamOption != null ? aa.selectedExamOption.text : 'بدون پاسخ'}"></span>
                </div>
                <div class="text-muted">
                    نمره خودکار: <span th:text="${aa.autoScore}"></span>
                </div>
            </div>

            <div th:if="${aa.examQuestion.questionType.name() == 'DESCRIPTIVE'}">
                <div class="mb-2">
                    <strong>پاسخ دانشجو:</strong>
                </div>
                <div class="border rounded p-2 mb-3" th:text="${aa.descriptiveText != null ? aa.descriptiveText : 'بدون پاسخ'}"></div>

                <form th:action="@{/teacher/attempt-answer/{id}/score(id=${aa.id})}" method="post" class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">نمره (حداکثر: <span th:text="${aa.examQuestion.score}"></span>)</label>
                        <input class="form-control" type="number" step="0.25" min="0"
                               th:attr="max=${aa.examQuestion.score}"
                               name="score" th:value="${aa.manualScore}">
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary">ثبت نمره</button>
                    </div>
                    <div class="col-md-4 text-muted">
                        نمره نهایی این سوال: <span th:text="${aa.finalScore}"></span>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>
